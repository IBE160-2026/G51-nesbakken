<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jaunt — Direction 4: Hillside Storybook</title>
<style>
/*
  DIRECTION 4 — "HILLSIDE STORYBOOK"
  Position on the spectrum: MOST ILLUSTRATED / CHARACTERFUL base map — brings
  the logo's rolling-hill scenery onto the map itself, not just the park.
  Roads become winding cream ribbons, stops become little flag badges.
  Deliberately tests the edge of "still a usable map": street labels are
  kept in a plain, high-contrast sans so orientation survives the illustration.

  Hex values used:
    --paper:        #FAF6EC   page background
    --ink:          #163A2D   primary text, deep forest ink
    --ink-soft:     #6E8169   secondary text
    --sky:          #F2ECDA   base "sky"/ground wash behind the hills
    --hill-far:     #B5C4A0   brand sage — back hill layer
    --hill-mid:     #93AD80   mid hill layer, one step darker than sage
    --hill-near:    #1E4A3A   brand forest green — front hill layer, same green as route
    --road:         #FBF6E8   roads as winding cream ribbons over the hills
    --road-edge:    #E9DFC4   road ribbon edge, for a hand-drawn outline feel
    --house-wall:   #F2E4D3
    --house-roof:   #C9684B   warm muted terracotta roof, slightly deeper than Dir.3
    --water:        #9FC2C9   canal ribbon
    --route:        #1E4A3A   brand forest green trail ribbon
    --route-edge:   #163A2D   trail ribbon outline
    --flag-pole:    #163A2D
    --flag-fill:    #1E4A3A
    --pin-you:      #1E4A3A
    --pin-cap:      #C9684B

  Rationale (2-3 sentences):
  Hillside Storybook takes the logo's illustrated rolling-hill scenery and makes
  it the whole map, not a background detail — layered hills, little peaked-roof
  terrace houses and a winding cream road ribbon give the screen real charm and
  tie it directly to existing brand art. It is the riskiest direction for
  legibility, so street names stay in a plain bold sans at a fixed horizontal
  angle and the route keeps a single unbroken color (forest green) so the walk
  never gets lost inside the scenery — the test of whether "storybook" can still
  function as a map.
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #FAF6EC;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  padding: 40px 16px 80px;
  color: #163A2D;
}
.heading { max-width: 460px; text-align: center; }
.heading h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 8px; }
.heading p { font-size: 13.5px; line-height: 1.55; color: #6E8169; }

.phone {
  width: 320px;
  height: 660px;
  background: #163A2D;
  border-radius: 48px;
  padding: 12px;
  box-shadow: 0 30px 60px -20px rgba(22,58,45,0.45);
}
.screen {
  width: 100%;
  height: 100%;
  background: #F2ECDA;
  border-radius: 38px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 18px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #F2ECDA;
  z-index: 3;
}
.header .back { font-size: 20px; color: #163A2D; width: 24px; }
.header .title { font-size: 15px; font-weight: 800; text-align: center; letter-spacing: -0.01em; }
.header .title .sub { display: block; font-size: 11px; font-weight: 600; color: #6E8169; margin-top: 1px; }
.time-pill {
  background: #1E4A3A; color: #FAF6EC; font-size: 12px; font-weight: 800;
  padding: 7px 13px; border-radius: 20px;
}

.map-wrap { flex: 1; position: relative; background: #F2ECDA; }
.map-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.street-label { font-size: 9px; fill: #163A2D; font-weight: 800; }

.bottom-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 18px 22px; display: flex; justify-content: center;
}
.view-list-pill {
  background: #1E4A3A; color: #FAF6EC; font-size: 13.5px; font-weight: 800;
  padding: 14px 28px; border-radius: 40% 40% 40% 40% / 60% 60% 40% 40%;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 10px 26px -8px rgba(22,58,45,0.55);
}
</style>
</head>
<body>

<div class="heading">
  <h1>Direction 4 — Hillside Storybook</h1>
  <p>The logo's rolling-hill illustration becomes the whole base map, with winding roads and tiny terrace houses. Street labels stay plain and bold so the map still orients, even at full illustration.</p>
</div>

<div class="phone">
  <div class="screen">

    <div class="header">
      <div class="back">‹</div>
      <div class="title">Newtown History Loop<span class="sub">4 stops · 1.9 km</span></div>
      <div class="time-pill">~50 min</div>
    </div>

    <div class="map-wrap">
      <svg viewBox="0 0 320 430" preserveAspectRatio="xMidYMid slice">
        <rect width="320" height="430" fill="#F2ECDA"/>

        <!-- layered illustrated hills, far to near -->
        <path d="M 0 60 Q 80 20 160 55 T 320 50 L 320 140 Q 240 110 160 135 T 0 125 Z" fill="#B5C4A0"/>
        <path d="M 0 150 Q 90 115 180 150 T 320 145 L 320 230 Q 230 205 150 225 T 0 215 Z" fill="#93AD80"/>
        <path d="M 0 330 Q 100 300 200 325 T 320 315 L 320 430 L 0 430 Z" fill="#1E4A3A" opacity="0.14"/>

        <!-- canal -->
        <path d="M 0 20 C 30 40, 15 65, 0 78 Z" fill="#9FC2C9"/>

        <!-- winding road ribbon (King St) -->
        <path d="M 0 400 C 60 370, 90 330, 110 290 C 135 245, 150 190, 190 150 C 225 115, 260 90, 320 55"
              fill="none" stroke="#E9DFC4" stroke-width="18" stroke-linecap="round"/>
        <path d="M 0 400 C 60 370, 90 330, 110 290 C 135 245, 150 190, 190 150 C 225 115, 260 90, 320 55"
              fill="none" stroke="#FBF6E8" stroke-width="13" stroke-linecap="round"/>

        <path d="M 40 430 C 60 350, 90 290, 150 260 C 200 235, 250 230, 300 210"

        <text class="street-label" x="150" y="186">King St</text>
        <text class="street-label" x="190" y="268">Bedford St</text>

        <!-- little terrace houses along the ribbon -->
        <g>
          <rect x="235" y="78" width="18" height="13" fill="#F2E4D3"/>
          <polygon points="235,78 244,69 253,78" fill="#C9684B"/>
          <rect x="257" y="72" width="18" height="13" fill="#F2E4D3"/>
          <polygon points="257,72 266,63 275,72" fill="#C9684B"/>

          <rect x="20" y="360" width="18" height="14" fill="#F2E4D3"/>
          <polygon points="20,360 29,350 38,360" fill="#C9684B"/>
          <rect x="42" y="355" width="18" height="14" fill="#F2E4D3"/>
          <polygon points="42,355 51,345 60,355" fill="#C9684B"/>
        </g>

        <!-- scattered illustrated trees -->
        <g fill="#1E4A3A">
          <circle cx="60" cy="90" r="9"/>
          <circle cx="78" cy="98" r="7"/>
          <circle cx="270" cy="200" r="8"/>
          <circle cx="285" cy="212" r="6"/>
          <circle cx="110" cy="330" r="8"/>
        </g>

        <!-- route: solid forest-green trail ribbon with outline -->
        <path d="M 160 395
                 C 130 360, 100 330, 95 290
                 C 90 255, 105 220, 140 200
                 C 165 215, 185 245, 205 260
                 C 230 278, 255 265, 260 230
                 C 264 200, 245 165, 215 145
                 C 230 120, 250 95, 275 75"
              fill="none" stroke="#163A2D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 160 395
                 C 130 360, 100 330, 95 290
                 C 90 255, 105 220, 140 200
                 C 165 215, 185 245, 205 260
                 C 230 278, 255 265, 260 230
                 C 264 200, 245 165, 215 145
                 C 230 120, 250 95, 275 75"
              fill="none" stroke="#1E4A3A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- stop flags -->
        <g transform="translate(140,200)">
          <line x1="0" y1="2" x2="0" y2="-22" stroke="#163A2D" stroke-width="2.5"/>
          <path d="M 0 -22 L 16 -16 L 0 -10 Z" fill="#1E4A3A"/>
          <text x="2" y="-13.5" font-size="8" font-weight="800" fill="#FAF6EC">1</text>
        </g>
        <text x="100" y="188" font-size="9.5" font-weight="800" fill="#163A2D">St Stephen's Church</text>

        <g transform="translate(205,260)">
          <line x1="0" y1="2" x2="0" y2="-22" stroke="#163A2D" stroke-width="2.5"/>
          <path d="M 0 -22 L 16 -16 L 0 -10 Z" fill="#1E4A3A"/>
          <text x="2" y="-13.5" font-size="8" font-weight="800" fill="#FAF6EC">2</text>
        </g>
        <text x="213" y="288" font-size="9.5" font-weight="800" fill="#163A2D">King St Terraces</text>

        <g transform="translate(260,230)">
          <line x1="0" y1="2" x2="0" y2="-22" stroke="#163A2D" stroke-width="2.5"/>
          <path d="M 0 -22 L 16 -16 L 0 -10 Z" fill="#1E4A3A"/>
          <text x="2" y="-13.5" font-size="8" font-weight="800" fill="#FAF6EC">3</text>
        </g>
        <text x="223" y="212" font-size="9.5" font-weight="800" fill="#163A2D">Mural Lane</text>

        <g transform="translate(215,145)">
          <line x1="0" y1="2" x2="0" y2="-22" stroke="#163A2D" stroke-width="2.5"/>
          <path d="M 0 -22 L 16 -16 L 0 -10 Z" fill="#1E4A3A"/>
          <text x="2" y="-13.5" font-size="8" font-weight="800" fill="#FAF6EC">4</text>
        </g>
        <text x="150" y="128" font-size="9.5" font-weight="800" fill="#163A2D">Camperdown Cemetery</text>

        <!-- current position: Jaunty's head with cap, storybook scale -->
        <g transform="translate(160,395)">
          <circle r="17" fill="#1E4A3A" stroke="#163A2D" stroke-width="2"/>
          <path d="M -10 -9 A 11 7 0 0 1 10 -9 L 10 -14 A 12 8 0 0 0 -10 -14 Z" fill="#C9684B"/>
          <circle cx="-5" cy="1.5" r="1.9" fill="#FAF6EC"/>
          <circle cx="5" cy="1.5" r="1.9" fill="#FAF6EC"/>
        </g>
        <text x="160" y="424" text-anchor="middle" font-size="9.5" font-weight="800" fill="#163A2D">Start / Newtown Stn</text>
      </svg>
    </div>

    <div class="bottom-bar">
      <div class="view-list-pill">View list ▲</div>
    </div>

  </div>
</div>

</body>
</html>
